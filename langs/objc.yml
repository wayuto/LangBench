# langs/objc.yml
name: "Objective-C"
platform: "linux"
file_extension: ".m"
setup_commands:
  - "sudo apt-get install -y --no-install-recommends gnustep gnustep-devel clang"
compile_command: "clang $(gnustep-config --objc-flags) $(gnustep-config --base-libs) -O3 -o {output} {sources}"
run_command: "{output}"
version_command: "clang --version"